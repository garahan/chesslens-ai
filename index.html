<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4ef" />
    <script>
      try {
        const stored = JSON.parse(
          localStorage.getItem("chesslens-appearance-v1") || "{}",
        );
        const p = stored && typeof stored === "object" ? stored : {};
        const palettes = {
          light: ["light", "#f5f4ef"],
          dark: ["dark", "#141c18"],
          studio: ["dark", "#1b1e24"],
          royal: ["dark", "#21182d"],
          ocean: ["dark", "#10242b"],
          sunset: ["light", "#faf1e8"],
        };
        const selected =
          p.app === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : Object.prototype.hasOwnProperty.call(palettes, p.app)
              ? p.app
              : "light";
        const root = document.documentElement;
        root.dataset.theme = selected;
        root.dataset.board = [
          "classic",
          "green",
          "walnut",
          "lavender",
          "slate",
          "ocean",
          "clay",
          "mono",
        ].includes(p.board)
          ? p.board
          : "classic";
        root.dataset.pieces = ["classic", "modern", "outline"].includes(
          p.pieces,
        )
          ? p.pieces
          : "classic";
        root.dataset.finish = ["ivory", "porcelain", "frost", "brass"].includes(
          p.finish,
        )
          ? p.finish
          : "ivory";
        root.style.colorScheme = palettes[selected][0];
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", palettes[selected][1]);
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ChessLens" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>ChessLens AI — Chess Analysis</title>
    <meta
      name="description"
      content="Got a chess screenshot? Check the pieces and find your next move with ChessLens. Made for Duolingo, with offline analysis on your phone."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
