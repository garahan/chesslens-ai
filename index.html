<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#292d27" />
    <script>
      try {
        const p = JSON.parse(
          localStorage.getItem("chesslens-appearance-v1") || "{}",
        );
        const theme =
          p.app === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : p.app || "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.board = p.board || "classic";
        document.documentElement.dataset.pieces = p.pieces || "classic";
        document.documentElement.style.colorScheme =
          theme === "light" ? "light" : "dark";
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ChessLens" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>ChessLens AI — Chess Analysis</title>
    <meta
      name="description"
      content="Got a chess screenshot? Check the pieces and find your next move with ChessLens. Made for Duolingo, with offline analysis on your phone."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
